<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الألمانية – اختبار السرعة</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c1b18;--mut:#6b675e;--pri:#d62828;--acc:#f4b400;--ok:#2e9e5b;--bad:#d62828;--bd:#e3dfd5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--card:#232119;--tx:#f3f0e6;--mut:#a39e8f;--bd:#3a372c;--pri:#ef5350}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,#222 33%,#d62828 33% 66%,#f4b400 66%);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{grid-column:1/-1;font-weight:800;margin:10px 0 0;color:var(--pri)}
.lv{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.lv .e{font-size:2rem}.lv .n{font-weight:700;margin:4px 0}.lv .s{color:var(--acc);letter-spacing:2px;min-height:1.3em}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px 12px;text-align:center;margin:12px 0}
.q small,.sub2{display:block;color:var(--mut);margin-bottom:8px}
.sub2{font-size:.9rem;margin:6px 0 0}
.q .w{font-size:2.2rem;font-weight:800}
.q .w.long{font-size:1.5rem;line-height:1.5}
.de{direction:ltr;unicode-bidi:isolate;display:inline-block}
.opts{display:grid;gap:10px}
.o{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;font:inherit;font-size:1.2rem;color:inherit;cursor:pointer}
.o.long{font-size:1rem}
.o:active{transform:scale(.98)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.spk{background:none;border:0;font-size:1.4rem;cursor:pointer}
.res{text-align:center}.big{font-size:3rem;font-weight:800}
.wrong{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;text-align:start;margin-top:12px}
.wrong div{padding:4px 0}
#mt{margin:0 0 12px}
.logo{display:flex;justify-content:center;margin:8px 0}
.logo svg{width:130px;height:130px}
.logo.win{animation:pop .6s ease-out}
.logo.lose{animation:shake .6s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.logo.win,.logo.lose{animation:none}.cf{display:none}}
</style>
</head>

<script>
// ============================================================
// ملف الأسئلة: عدّل هنا فقط، ولا تلمس index.html
// ------------------------------------------------------------
// شكل كل كلمة أو جملة:   "الألماني|العربي"
//   مثال:        "die Katze|قطة"      (اسم مع أداة التعريف)
//   مثال:        "schnell|سريع"       (كلمة بدون أداة)
//   مثال جملة:   "Ich habe Hunger.|أنا جائع"
//
// نوع المستوى t:
//   "w"  كلمات   (نصف الأسئلة عربي←ألماني ونصفها ألماني←عربي)
//   "a"  أدوات التعريف (اختيار der / die / das)، ولازم كل كلمة تبدأ بـ der أو die أو das
//   "s"  جمل
// tm = وقت السؤال بالثواني (اختياري). g = 3 هو قسم "صعب جدا"
//
// g = رقم القسم في GROUPS (0 كلمات، 1 أدوات التعريف، 2 جمل)
// e = الإيموجي، n = اسم المستوى
//
// لإضافة مستوى جديد: انسخ سطرًا كاملًا من LEVELS وضعه في المكان المناسب
// (لا تنس الفاصلة , في آخر السطر)، وغيّر الاسم والكلمات.
// كل مستوى يحتاج 10 كلمات على الأقل. لو وضعت أكثر من 10 يختار التطبيق 10 عشوائيًا في كل مرة.
// ============================================================

const GROUPS=["كلمات","أدوات التعريف (der / die / das)","جمل","صعب جدا 🔥"];

const LEVELS=[
{g:0,n:"التحيات",e:"👋",t:"w",w:["Hallo|مرحبا","Danke|شكرا","Bitte|من فضلك","Ja|نعم","Nein|لا","Tschüss|وداعا","Guten Morgen|صباح الخير","Gute Nacht|تصبح على خير","Entschuldigung|آسف","Willkommen|أهلا بك"]},
{g:0,n:"الأرقام",e:"🔢",t:"w",w:["eins|واحد","zwei|اثنان","drei|ثلاثة","vier|أربعة","fünf|خمسة","sechs|ستة","sieben|سبعة","acht|ثمانية","neun|تسعة","zehn|عشرة"]},
{g:0,n:"الطعام",e:"🍞",t:"w",w:["das Wasser|ماء","das Brot|خبز","die Milch|حليب","der Apfel|تفاحة","das Fleisch|لحم","der Käse|جبن","der Reis|أرز","der Kaffee|قهوة","das Ei|بيضة","der Fisch|سمك"]},
{g:0,n:"العائلة",e:"👨‍👩‍👧",t:"w",w:["der Vater|أب","die Mutter|أم","der Bruder|أخ","die Schwester|أخت","der Sohn|ابن","die Tochter|ابنة","der Großvater|جد","die Großmutter|جدة","das Kind|طفل","der Freund|صديق"]},
{g:0,n:"الأفعال",e:"🏃",t:"w",w:["gehen|يذهب","kommen|يأتي","essen|يأكل","trinken|يشرب","lernen|يتعلم","sprechen|يتكلم","schlafen|ينام","lesen|يقرأ","schreiben|يكتب","arbeiten|يعمل"]},
{g:0,n:"أشياء وأماكن",e:"🏠",t:"w",w:["das Haus|بيت","die Schule|مدرسة","die Stadt|مدينة","das Auto|سيارة","das Buch|كتاب","der Tisch|طاولة","die Straße|شارع","die Arbeit|عمل","die Zeit|وقت","der Hund|كلب"]},
{g:0,n:"الألوان",e:"🎨",t:"w",w:["rot|أحمر","blau|أزرق","grün|أخضر","gelb|أصفر","schwarz|أسود","weiß|أبيض","braun|بني","grau|رمادي","orange|برتقالي","rosa|وردي"]},
{g:0,n:"الجسم",e:"🧍",t:"w",w:["der Kopf|رأس","die Hand|يد","das Auge|عين","das Ohr|أذن","die Nase|أنف","der Mund|فم","der Fuß|قدم","das Herz|قلب","der Arm|ذراع","das Bein|ساق"]},
{g:0,n:"الأيام والوقت",e:"📅",t:"w",w:["Montag|الاثنين","Dienstag|الثلاثاء","Mittwoch|الأربعاء","Donnerstag|الخميس","Freitag|الجمعة","Samstag|السبت","Sonntag|الأحد","heute|اليوم","morgen|غدا","gestern|أمس"]},
{g:0,n:"الصفات",e:"↔️",t:"w",w:["groß|كبير","klein|صغير","neu|جديد","alt|قديم","gut|جيد","schlecht|سيء","schnell|سريع","langsam|بطيء","heiß|حار","kalt|بارد"]},

{g:1,n:"أدوات التعريف ١",e:"📘",t:"a",w:["die Mutter|أم","das Brot|خبز","der Vater|أب","der Tisch|طاولة","die Schule|مدرسة","das Kind|طفل","das Auto|سيارة","die Stadt|مدينة","der Hund|كلب","das Buch|كتاب"]},
{g:1,n:"أدوات التعريف ٢",e:"📗",t:"a",w:["das Ei|بيضة","das Herz|قلب","die Nase|أنف","der Fuß|قدم","das Wasser|ماء","die Tochter|ابنة","der Sohn|ابن","der Fisch|سمك","die Arbeit|عمل","der Reis|أرز"]},

{g:2,n:"جمل التعارف",e:"💬",t:"s",w:["Ich heiße Ahmed.|اسمي أحمد","Wie geht es dir?|كيف حالك؟","Mir geht es gut.|أنا بخير","Ich komme aus Ägypten.|أنا من مصر","Ich spreche Arabisch.|أنا أتكلم العربية","Ich lerne Deutsch.|أنا أتعلم الألمانية","Woher kommst du?|من أين أنت؟","Wie heißt du?|ما اسمك؟","Ich verstehe nicht.|أنا لا أفهم","Sprichst du Englisch?|هل تتكلم الإنجليزية؟"]},
{g:2,n:"جمل يومية",e:"☕",t:"s",w:["Ich habe Hunger.|أنا جائع","Ich habe Durst.|أنا عطشان","Wo ist die Toilette?|أين الحمام؟","Wie viel kostet das?|كم يكلف هذا؟","Ich möchte einen Kaffee.|أريد قهوة","Das Wasser ist kalt.|الماء بارد","Das Essen ist gut.|الطعام جيد","Ich gehe nach Hause.|أنا ذاهب إلى البيت","Ich liebe dich.|أحبك","Bis morgen!|أراك غدا"]},
{g:2,n:"جمل بسيطة",e:"📝",t:"s",w:["Der Vater arbeitet heute.|الأب يعمل اليوم","Die Mutter kocht Reis.|الأم تطبخ الأرز","Das Kind schläft.|الطفل ينام","Der Hund ist groß.|الكلب كبير","Das Auto ist neu.|السيارة جديدة","Ich lese ein Buch.|أنا أقرأ كتابا","Wir essen Brot.|نحن نأكل الخبز","Die Schule ist klein.|المدرسة صغيرة","Mein Bruder ist schnell.|أخي سريع","Ich sehe das Haus.|أنا أرى البيت"]},
{g:3,n:"مفردات مجردة",e:"🧠",t:"w",tm:6,w:["die Verantwortung|مسؤولية","die Gesellschaft|مجتمع","die Erfahrung|خبرة","die Entscheidung|قرار","die Gelegenheit|فرصة","die Herausforderung|تحدٍّ","das Verständnis|تفهّم","die Umwelt|بيئة","die Beziehung|علاقة","die Meinung|رأي"]},
{g:3,n:"أفعال متقدمة",e:"⚡",t:"w",tm:6,w:["verbessern|يحسّن","vermeiden|يتجنب","erreichen|يحقق","entscheiden|يقرر","verlangen|يطالب","behaupten|يزعم","bezweifeln|يشك في","erwähnen|يذكر","unterstützen|يدعم","überzeugen|يُقنع"]},
{g:3,n:"أفعال قابلة للفصل",e:"🔧",t:"w",tm:6,w:["aufstehen|ينهض","anrufen|يتصل هاتفيا","einladen|يدعو","mitbringen|يحضر معه","ausgeben|ينفق","abholen|يستلم","aufgeben|يستسلم","einkaufen|يتسوق","anfangen|يبدأ","zurückkommen|يعود"]},
{g:3,n:"صفات وظروف متقدمة",e:"🎯",t:"w",tm:6,w:["wahrscheinlich|على الأرجح","trotzdem|مع ذلك","übrigens|بالمناسبة","ausreichend|كافٍ","wesentlich|جوهري","zuverlässig|موثوق","gleichzeitig|في الوقت نفسه","ungefähr|تقريبا","vorsichtig|حذر","ehrlich|صادق"]},
{g:3,n:"أدوات التعريف الصعبة ١",e:"🔥",t:"a",tm:5,w:["das Mädchen|فتاة","die Sonne|شمس","der Mond|قمر","die Gesundheit|صحة","das Ergebnis|نتيجة","die Freiheit|حرية","das Gemüse|خضار","das Datum|تاريخ","der Tod|موت","die Mehrheit|أغلبية"]},
{g:3,n:"أدوات التعريف الصعبة ٢",e:"💎",t:"a",tm:5,w:["das Ende|نهاية","der Name|اسم","der Gedanke|فكرة","die Wirtschaft|اقتصاد","das Gebiet|منطقة","die Mitte|وسط","das Ziel|هدف","der Schmerz|ألم","die Aufgabe|مهمة","das Ereignis|حدث"]},
{g:3,n:"جمل فرعية",e:"🧩",t:"s",tm:14,w:["Ich weiß nicht, ob er kommt.|لا أعرف إن كان سيأتي","Wenn es regnet, bleibe ich zu Hause.|إذا أمطرت، أبقى في البيت","Ich bleibe zu Hause, weil ich krank bin.|أبقى في البيت لأنني مريض","Er sagt, dass er keine Zeit hat.|يقول إنه ليس لديه وقت","Ich lerne Deutsch, damit ich in Deutschland arbeiten kann.|أتعلم الألمانية لكي أعمل في ألمانيا","Obwohl es kalt ist, gehen wir spazieren.|رغم أن الجو بارد، نخرج للتنزه","Als ich klein war, wohnte ich in Kairo.|عندما كنت صغيرا، كنت أسكن في القاهرة","Ich frage mich, wo er wohnt.|أتساءل أين يسكن","Bevor du gehst, ruf mich an.|قبل أن تذهب، اتصل بي","Nachdem er gegessen hatte, ging er schlafen.|بعد أن أكل، ذهب لينام"]},
{g:3,n:"جمل الشرط والتمنّي",e:"🌙",t:"s",tm:14,w:["Wenn ich Zeit hätte, würde ich dich besuchen.|لو كان عندي وقت لزرتك","Ich hätte gern ein Glas Wasser.|أود كوبا من الماء","Könnten Sie mir bitte helfen?|هل يمكنك مساعدتي من فضلك؟","Wenn ich reich wäre, würde ich reisen.|لو كنت غنيا لسافرت","Er tut so, als ob er alles wüsste.|يتظاهر كأنه يعرف كل شيء","Ich wünschte, ich könnte fliegen.|أتمنى لو كنت أستطيع الطيران","An deiner Stelle würde ich das nicht tun.|لو كنت مكانك لما فعلت ذلك","Hätte ich das gewusst, wäre ich gekommen.|لو علمت ذلك لحضرت","Es wäre schön, wenn du kommen könntest.|سيكون جميلا لو استطعت المجيء","Ich würde gern mehr Deutsch sprechen.|أود أن أتكلم الألمانية أكثر"]},
{g:3,n:"تعابير ألمانية",e:"🗣️",t:"s",tm:14,w:["Das ist mir Wurst.|لا يهمني هذا","Ich verstehe nur Bahnhof.|لا أفهم شيئا","Ich drücke dir die Daumen.|أتمنى لك الحظ","Das ist nicht mein Bier.|هذا ليس من شأني","Jetzt ist der Groschen gefallen.|الآن فهمت","Das Leben ist kein Ponyhof.|الحياة ليست نزهة","Ich habe die Nase voll.|لقد مللت وطفح الكيل","Er hat Schwein gehabt.|كان محظوظا","Da liegt der Hund begraben.|هنا تكمن المشكلة","Ich bin Feuer und Flamme.|أنا متحمس جدا"]},
{g:3,n:"جمل رسمية وعمل",e:"💼",t:"s",tm:14,w:["Ich möchte mich um die Stelle bewerben.|أود التقدم لهذه الوظيفة","Bitte schicken Sie mir die Unterlagen zu.|من فضلك أرسل لي المستندات","Ich habe einen Termin beim Arzt.|لدي موعد عند الطبيب","Leider muss ich den Termin verschieben.|للأسف يجب أن أؤجل الموعد","Vielen Dank für Ihre schnelle Antwort.|شكرا جزيلا على ردكم السريع","Ich würde gern ein Konto eröffnen.|أود فتح حساب","Die Miete ist zu hoch für mich.|الإيجار مرتفع جدا بالنسبة لي","Ich brauche eine Aufenthaltserlaubnis.|أحتاج إلى تصريح إقامة","Können Sie das bitte wiederholen?|هل يمكنك تكرار ذلك من فضلك؟","Ich bin mit dem Ergebnis nicht zufrieden.|لست راضيا عن النتيجة"]}

<script>
const P=s=>{const[a,b]=s.split("|");const m=/^(der|die|das) (.+)$/.exec(a);return m?{art:m[1],de:m[2],ar:b}:{de:a,ar:b}};
const full=x=>x.art?x.art+" "+x.de:x.de;
const G=GROUPS;
const L=LEVELS.map(l=>({...l,w:l.w.map(P)}));
const PASS=7;
let prog={};
try{prog=JSON.parse(localStorage.getItem("dp")||"{}")}catch(e){prog={}}
function save(){try{localStorage.setItem("dp",JSON.stringify(prog))}catch(e){}}
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=b=>b>=10?"★★★":b>=8?"★★☆":b>=PASS?"★☆☆":"☆☆☆";
let S=null,tm=null;

/* ===== الصوت والشعارات (فوز / خسارة) ===== */
let AC=null,mute=false;
try{mute=localStorage.getItem("dm")==="1"}catch(e){}
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
/* كل نغمة: [التردد بالهرتز، وقت البداية، المدة بالثواني] - غيّرها لتغيّر اللحن */
const SND={
  win:{type:"triangle",vol:.28,notes:[[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.5]]},
  lose:{type:"sawtooth",vol:.14,notes:[[392,0,.28],[349,.28,.28],[294,.56,.28],[220,.84,.6]]}
};
function sfx(k){
  if(mute)return;
  try{
    unlock();const n=AC.currentTime,c=SND[k];
    c.notes.forEach(([f,t,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=c.type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,n+t);
      g.gain.exponentialRampToValueAtTime(c.vol,n+t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,n+t+d);
      o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+d+.05);
    });
  }catch(e){}
}
/* الشعارات: SVG - تقدر تغيّرها أو تستبدلها بصورة <img> */
const WIN='<div class="logo win"><svg viewBox="0 0 120 120" aria-label="فوز"><circle cx="60" cy="60" r="56" fill="#f4b400"/><circle cx="60" cy="60" r="47" fill="#ffd54f"/><path d="M38 34h44v20a22 22 0 0 1-44 0z" fill="#d62828"/><path d="M38 40H28v6a12 12 0 0 0 12 12M82 40h10v6a12 12 0 0 1-12 12" fill="none" stroke="#d62828" stroke-width="5" stroke-linecap="round"/><rect x="55" y="74" width="10" height="12" fill="#d62828"/><rect x="44" y="86" width="32" height="8" rx="3" fill="#d62828"/><path d="M60 40l3.5 7.4 8 1-5.9 5.6 1.5 8L60 58l-7.1 3.9 1.5-8-5.9-5.6 8-1z" fill="#fff"/></svg></div>';
const LOSE='<div class="logo lose"><svg viewBox="0 0 120 120" aria-label="خسارة"><circle cx="60" cy="60" r="56" fill="#8d8a80"/><circle cx="60" cy="60" r="47" fill="#b9b5a8"/><circle cx="44" cy="52" r="6" fill="#222"/><circle cx="76" cy="52" r="6" fill="#222"/><path d="M42 84q18-18 36 0" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/><path d="M80 62q6 8 0 14q-6-6 0-14z" fill="#4aa3ff"/></svg></div>';
function confetti(){
  const c=["#d62828","#f4b400","#2e9e5b","#1c6fd6","#222"];let h="";
  for(let i=0;i<30;i++)h+='<i class="cf" style="left:'+Math.random()*100+'%;background:'+c[i%5]+';animation-delay:'+(Math.random()*.8)+'s"></i>';
  const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),4000);
}

function home(){
  clearInterval(tm);
  let h='<div class="stripe"></div><h1>Deutsch lernen 🇩🇪</h1><p class="sub">اختبار سرعة: 10 أسئلة لكل مستوى. أجب بسرعة لتحصل على نقاط أكثر. أحرز '+PASS+' من 10 لفتح المستوى التالي.</p><button class="btn alt" id="mt">'+(mute?"🔇 الصوت متوقف":"🔊 الصوت يعمل")+'</button><div class="grid">',pg=-1;
  L.forEach((l,i)=>{
    if(l.g!==pg){h+='<div class="sec">'+G[l.g]+'</div>';pg=l.g}
    const lock=i>0&&L[i-1].g===l.g&&!((prog[i-1]||{}).best>=PASS);
    h+='<button class="lv" data-i="'+i+'"'+(lock?" disabled":"")+'><div class="e">'+(lock?"🔒":l.e)+'</div><div class="n">'+l.n+'</div><div class="s">'+stars((prog[i]||{}).best||0)+'</div></button>';
  });
  $.innerHTML=h+'</div>';
  document.getElementById("mt").onclick=()=>{mute=!mute;try{localStorage.setItem("dm",mute?"1":"0")}catch(e){}if(!mute)sfx("win");home()};
  $.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i));
}

function start(i){
  unlock();
  const lv=L[i],w=sh(lv.w).slice(0,10);
  const qs=w.map((x,k)=>({w:x,dir:lv.t==="a"?"art":k<5?"ar2de":"de2ar"}));
  S={i,qs:sh(qs),k:0,ok:0,pts:0,wrong:[],t0:Date.now()};
  ask();
}

function ask(){
  clearInterval(tm);
  const lv=L[S.i],q=S.qs[S.k],w=q.w,TT=lv.tm||(lv.t==="s"?12:8),pool=lv.w.filter(x=>x!==w);
  let head,main,opts,sub="",spk=true;
  if(q.dir==="art"){
    head="ما أداة التعريف الصحيحة؟";main='<span class="de">___ '+w.de+'</span>';
    sub='<div class="sub2">'+w.ar+'</div><div class="sub2">der مذكر · die مؤنث · das محايد</div>';
    opts=["der","die","das"].map(a=>({t:a,de:1,ok:a===w.art}));
  }else if(q.dir==="ar2de"){
    head="اختر الترجمة الألمانية";main=w.ar;spk=false;
    opts=sh([w,...sh(pool).slice(0,3)]).map(o=>({t:full(o),de:1,ok:o===w}));
  }else{
    head="اختر الترجمة العربية";main='<span class="de">'+full(w)+'</span>';
    opts=sh([w,...sh(pool).slice(0,3)]).map(o=>({t:o.ar,de:0,ok:o===w}));
  }
  const lg=lv.t==="s"?" long":"";
  $.innerHTML='<div class="top"><span>'+lv.n+'</span><span>'+(S.k+1)+' / 10</span><span>⭐ '+S.pts+'</span></div>'+
  '<div class="bar"><i id="b"></i></div>'+
  '<div class="q"><small>'+head+'</small><div class="w'+lg+'">'+main+'</div>'+sub+(spk?'<button class="spk" id="sp" aria-label="نطق">🔊</button>':"")+'</div>'+
  '<div class="opts">'+opts.map((o,n)=>'<button class="o'+lg+'" data-n="'+n+'">'+(o.de?'<span class="de">'+o.t+'</span>':o.t)+'</button>').join("")+'</div>';
  const sp=document.getElementById("sp");
  if(sp)sp.onclick=()=>say(full(w));
  let left=TT,done=false;const bar=document.getElementById("b");
  const btns=[...$.querySelectorAll(".o")];
  function fin(pick){
    if(done)return;done=true;clearInterval(tm);
    const good=pick!==null&&opts[pick].ok;
    btns.forEach((b,n)=>{b.disabled=true;if(opts[n].ok)b.classList.add("ok");else if(n===pick)b.classList.add("no")});
    if(good){S.ok++;S.pts+=10+Math.ceil(left)}else S.wrong.push(w);
    say(full(w));
    setTimeout(()=>{S.k++;S.k<10?ask():result()},lv.t==="s"?1600:1000);
  }
  btns.forEach((b,n)=>b.onclick=()=>fin(n));
  tm=setInterval(()=>{left-=.1;bar.style.width=Math.max(0,left/TT*100)+"%";if(left<=3)bar.style.background="var(--bad)";if(left<=0)fin(null)},100);
}

function webSay(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function say(t){
  let T=null;
  try{T=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech}catch(e){}
  if(T&&T.speak){
    Promise.resolve(T.stop&&T.stop()).catch(()=>{}).then(()=>T.speak({text:t,lang:"de-DE",rate:.9,pitch:1,volume:1})).catch(()=>webSay(t));
  }else webSay(t);
}

function result(){
  clearInterval(tm);
  const p=prog[S.i]||{};
  if(!(p.best>=S.ok))p.best=S.ok;
  if(!(p.pts>=S.pts))p.pts=S.pts;
  prog[S.i]=p;save();
  const pass=S.ok>=PASS,sec=Math.round((Date.now()-S.t0)/1000);
  $.innerHTML='<div class="res">'+(S.ok>=PASS?WIN:LOSE)+'<div class="big">'+S.ok+' / 10</div><div style="color:var(--acc);font-size:1.6rem">'+stars(S.ok)+'</div>'+
  '<p>'+(pass?"🎉 مبروك! تم اجتياز المستوى":"حاول مرة أخرى، تحتاج "+PASS+" على الأقل")+'</p><p class="sub">النقاط: '+S.pts+' · الوقت: '+sec+' ثانية</p>'+
  '<button class="btn" id="re">إعادة المستوى</button>'+
  (pass&&S.i<L.length-1?'<button class="btn" id="nx">المستوى التالي ▶</button>':"")+
  '<button class="btn alt" id="hm">القائمة</button>'+
  (S.wrong.length?'<div class="wrong"><b>للمراجعة:</b>'+S.wrong.map(w=>'<div><span class="de">'+full(w)+'</span> = '+w.ar+'</div>').join("")+'</div>':"")+'</div>';
  document.getElementById("re").onclick=()=>start(S.i);
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>start(S.i+1);
  document.getElementById("hm").onclick=home;
  sfx(pass?"win":"lose");if(pass)confetti();
}
home();
</script>
</body>
