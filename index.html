<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الألمانية – اختبار السرعة</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c1b18;--mut:#6b675e;--pri:#d62828;--acc:#f4b400;--ok:#2e9e5b;--bad:#d62828;--bd:#e3dfd5;--der:#1c6fd6;--die:#d62828;--das:#2e9e5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--card:#232119;--tx:#f3f0e6;--mut:#a39e8f;--bd:#3a372c;--pri:#ef5350;--der:#5aa2ff;--die:#ff7a76;--das:#5cc98a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,#222 33%,#d62828 33% 66%,#f4b400 66%);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{grid-column:1/-1;font-weight:800;margin:10px 0 0;color:var(--pri)}
.lv{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.lv .e{font-size:2rem}.lv .n{font-weight:700;margin:4px 0}.lv .s{color:var(--acc);letter-spacing:2px;min-height:1.3em}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px 12px;text-align:center;margin:12px 0}
.q small,.sub2{display:block;color:var(--mut);margin-bottom:8px}
.sub2{font-size:.9rem;margin:6px 0 0}
.q .w{font-size:2.2rem;font-weight:800}
.q .w.long{font-size:1.5rem;line-height:1.5}
.de{direction:ltr;unicode-bidi:isolate;display:inline-block}
.opts{display:grid;gap:10px}
.o{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;font:inherit;font-size:1.2rem;color:inherit;cursor:pointer}
.o.long{font-size:1rem}
.o:active{transform:scale(.98)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.spk{background:none;border:0;font-size:1.4rem;cursor:pointer}
.res{text-align:center}.big{font-size:3rem;font-weight:800}
.wrong{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;text-align:start;margin-top:12px}
.wrong div{padding:4px 0}
.a-der{color:var(--der);font-weight:800}.a-die{color:var(--die);font-weight:800}.a-das{color:var(--das);font-weight:800}
.wel{text-align:center;padding-top:24px}.flag{font-size:4rem}
.wel input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:8px 0 12px;text-align:center}
.feat{display:grid;gap:8px;margin:16px 0;text-align:start}
.feat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;color:var(--mut)}
.stat b{display:block;font-size:1.5rem;color:var(--tx)}
.pb{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-weight:700;margin:4px}
.me{background:color-mix(in srgb,var(--acc) 25%,var(--card))}
.blank{color:var(--pri);border-bottom:3px solid var(--pri);padding:0 8px}
.rk{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.logo{display:flex;justify-content:center;margin:8px 0}
.logo svg{width:130px;height:130px}
.logo.win{animation:pop .6s ease-out}
.logo.lose{animation:shake .6s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.logo.win,.logo.lose{animation:none}.cf{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script>
const P=s=>{const[a,b,c]=s.split("|");if(c!==undefined)return{de:a,ans:b,ds:c.split(",")};const m=/^(der|die|das) (.+)$/.exec(a);return m?{art:m[1],de:m[2],ar:b}:{de:a,ar:b}};
const full=x=>x.ans?x.de.replace("___",x.ans):x.art?x.art+" "+x.de:x.de;
const G=GROUPS;
const L=LEVELS.map(l=>({...l,w:l.w.map(P)}));
const PASS=7;
let prog={};
try{prog=JSON.parse(localStorage.getItem("dp")||"{}")}catch(e){prog={}}
function save(){try{localStorage.setItem("dp",JSON.stringify(prog))}catch(e){}}
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=b=>b>=10?"★★★":b>=8?"★★☆":b>=PASS?"★☆☆":"☆☆☆";
let S=null,tm=null;
const CE=["A1","A2","B1","B2","C1","C2"];
let TM=1.5;try{const v=localStorage.getItem("dtm");if(v!==null&&!isNaN(parseFloat(v)))TM=parseFloat(v)}catch(e){}
const TMS=[1,1.5,2,0];
const tmLabel=()=>TM===0?"بدون وقت":"×"+TM;
function toggleTime(){TM=TMS[(TMS.indexOf(TM)+1)%TMS.length];try{localStorage.setItem("dtm",String(TM))}catch(e){}home()}
function genStart(g){
  unlock();
  const all=[];L.forEach(l=>{if(g===null||l.g===g)l.w.forEach(x=>all.push({lv:l,w:x}))});
  const qs=sh(all).slice(0,20).map(o=>({lv:o.lv,w:o.w,dir:o.lv.t==="a"?"art":o.lv.t==="c"?"cloze":Math.random()<.5?"ar2de":"de2ar"}));
  S={gen:true,g,key:"G:"+(g===null?"all":CE[g]),i:-1,qs,k:0,ok:0,pts:0,wrong:[],t0:Date.now(),n:qs.length};
  ask();
}
const C=typeof CFG!=="undefined"?CFG:{gc:"",sbUrl:"",sbKey:""};
const SB=!!(C.sbUrl&&C.sbKey);
let VIS="";
function pid(){let i="";try{i=localStorage.getItem("dpid")||"";if(!i){i=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("dpid",i)}}catch(e){}return i||"anon"}
function hdr(){const h={apikey:C.sbKey,"Content-Type":"application/json"};if(!C.sbKey.startsWith("sb_"))h.Authorization="Bearer "+C.sbKey;return h}
function totals(){let tp=0,dn=0;L.forEach((l,i)=>{const p=pr(i);tp+=p.pts||0;if(p.best>=PASS)dn++});Object.keys(prog).forEach(k=>{if(k[0]==="G")tp+=prog[k].pts||0});return{tp,dn}}
function pushScore(){
  if(!SB)return;const t=totals();
  try{fetch(C.sbUrl+"/rest/v1/players?on_conflict=id",{method:"POST",headers:{...hdr(),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:pid(),name:(NAME||"زائر").slice(0,20),points:t.tp,levels:t.dn,updated_at:new Date().toISOString()})}).catch(()=>{})}catch(e){}
}
async function loadVis(){
  if(!C.gc)return;
  const e=()=>document.getElementById("vc");
  try{
    if(!VIS){
      const r=await fetch("https://"+C.gc+".goatcounter.com/counter/TOTAL.json",{cache:"no-store"});
      if(r.ok){
        const j=await r.json(),n=x=>parseInt(String(x||"0").replace(/\D/g,""),10)||0;
        VIS=String(Math.max(n(j.count),n(j.count_unique)));
      }
    }
    if(e())e().textContent="👁️ "+(VIS||"؟");
  }catch(x){if(e())e().textContent="👁️ ؟"}
}
async function board(){
  clearInterval(tm);
  $.innerHTML='<div class="stripe"></div><h1>🌍 المتصدرون</h1><p class="sub">جارٍ التحميل…</p>';
  let rows=null;
  try{const r=await fetch(C.sbUrl+"/rest/v1/players?select=id,name,points,levels&order=points.desc&limit=20",{headers:hdr()});if(r.ok)rows=await r.json()}catch(e){}
  const me=pid(),md=["🥇","🥈","🥉"];
  $.innerHTML='<div class="stripe"></div><h1>🌍 المتصدرون</h1><p class="sub">أعلى 20 لاعبًا من كل الزوار (مجموع النقاط).</p>'+
  (rows===null?'<p class="sub">تعذّر تحميل القائمة، تأكد من الإنترنت وحاول لاحقًا.</p>':rows.length?rows.map((x,n)=>'<div class="rk'+(x.id===me?" me":"")+'"><span>'+(md[n]||(n+1)+".")+" "+esc(x.name)+'</span><span>⭐ '+x.points+" · "+x.levels+' مستوى</span></div>').join(""):'<p class="sub">لا يوجد لاعبون بعد، كن الأول!</p>')+
  '<div class="row" style="margin-top:16px"><button class="btn" id="bk">رجوع</button></div>';
  document.getElementById("bk").onclick=home;
}
let NAME="";try{NAME=localStorage.getItem("dn")||""}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fullH=x=>x.ans?esc(x.de).replace("___","<b>"+esc(x.ans)+"</b>"):x.art?'<span class="a-'+x.art+'">'+x.art+'</span> '+x.de:x.de;
const K=i=>L[i].g+":"+L[i].n;
const pr=i=>prog[K(i)]||{};

/* ===== الصوت والشعارات (فوز / خسارة) ===== */
let AC=null,mute=false;
try{mute=localStorage.getItem("dm")==="1"}catch(e){}
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
/* كل نغمة: [التردد بالهرتز، وقت البداية، المدة بالثواني] - غيّرها لتغيّر اللحن */
const SND={
  win:{type:"triangle",vol:.28,notes:[[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.5]]},
  lose:{type:"sawtooth",vol:.14,notes:[[392,0,.28],[349,.28,.28],[294,.56,.28],[220,.84,.6]]}
};
function sfx(k){
  if(mute)return;
  try{
    unlock();const n=AC.currentTime,c=SND[k];
    c.notes.forEach(([f,t,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=c.type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,n+t);
      g.gain.exponentialRampToValueAtTime(c.vol,n+t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,n+t+d);
      o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+d+.05);
    });
  }catch(e){}
}
/* الشعارات: SVG - تقدر تغيّرها أو تستبدلها بصورة <img> */
const WIN='<div class="logo win"><svg viewBox="0 0 120 120" aria-label="فوز"><circle cx="60" cy="60" r="56" fill="#f4b400"/><circle cx="60" cy="60" r="47" fill="#ffd54f"/><path d="M38 34h44v20a22 22 0 0 1-44 0z" fill="#d62828"/><path d="M38 40H28v6a12 12 0 0 0 12 12M82 40h10v6a12 12 0 0 1-12 12" fill="none" stroke="#d62828" stroke-width="5" stroke-linecap="round"/><rect x="55" y="74" width="10" height="12" fill="#d62828"/><rect x="44" y="86" width="32" height="8" rx="3" fill="#d62828"/><path d="M60 40l3.5 7.4 8 1-5.9 5.6 1.5 8L60 58l-7.1 3.9 1.5-8-5.9-5.6 8-1z" fill="#fff"/></svg></div>';
const LOSE='<div class="logo lose"><svg viewBox="0 0 120 120" aria-label="خسارة"><circle cx="60" cy="60" r="56" fill="#8d8a80"/><circle cx="60" cy="60" r="47" fill="#b9b5a8"/><circle cx="44" cy="52" r="6" fill="#222"/><circle cx="76" cy="52" r="6" fill="#222"/><path d="M42 84q18-18 36 0" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/><path d="M80 62q6 8 0 14q-6-6 0-14z" fill="#4aa3ff"/></svg></div>';
function confetti(){
  const c=["#d62828","#f4b400","#2e9e5b","#1c6fd6","#222"];let h="";
  for(let i=0;i<30;i++)h+='<i class="cf" style="left:'+Math.random()*100+'%;background:'+c[i%5]+';animation-delay:'+(Math.random()*.8)+'s"></i>';
  const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),4000);
}

function toggleMute(){mute=!mute;try{localStorage.setItem("dm",mute?"1":"0")}catch(e){}if(!mute)sfx("win");home()}

function welcome(){
  clearInterval(tm);
  $.innerHTML='<div class="wel"><div class="flag">🇩🇪</div><h1>Deutsch lernen</h1><p class="sub">'+(NAME?'أهلا '+esc(NAME)+' 👋':'تعلّم الألمانية للناطقين بالعربية')+'</p><div class="feat"><div>📚 '+L.length+' مستوى من A1 إلى C2</div><div>⚡ اختبارات سرعة، 10 أسئلة لكل مستوى</div><div>🎨 ألوان أدوات التعريف: <span class="a-der">der</span> · <span class="a-die">die</span> · <span class="a-das">das</span></div><div>🏆 نقاط ونجوم وشاشة أعلى النتائج</div></div>'+(NAME?"":'<input id="nm" maxlength="20" placeholder="اكتب اسمك (اختياري)">')+'<button class="btn" id="go">ابدأ التعلم ▶</button></div>';
  document.getElementById("go").onclick=()=>{const n=document.getElementById("nm");if(n&&n.value.trim()){NAME=n.value.trim();try{localStorage.setItem("dn",NAME)}catch(e){}}unlock();home()};
}

function home(){
  clearInterval(tm);
  let h='<div class="stripe"></div><h1>Deutsch lernen 🇩🇪</h1><p class="sub">'+(NAME?esc(NAME)+"، ":"")+'اختر مستواك. أحرز '+PASS+' من 10 لفتح المستوى التالي.</p><div class="row"><button class="btn alt" id="hs">🏆 أعلى النتائج</button><button class="btn alt" id="tb">⏱️ الوقت: '+tmLabel()+'</button><button class="btn alt" id="mt">'+(mute?"🔇 الصوت متوقف":"🔊 الصوت يعمل")+'</button>'+(SB?'<button class="btn alt" id="gb">🌍 المتصدرون</button>':"")+(C.gc?'<span class="chip" id="vc" title="عدد الزوار">👁️ '+(VIS||"…")+'</span>':"")+'</div><div class="sec" style="margin:4px 0 8px">🎲 اختبار عام (20 سؤالًا مختلطًا)</div><div class="row" id="gen"><button class="btn" data-g="all">كل المستويات</button>'+CE.map((c,i)=>'<button class="btn alt" data-g="'+i+'">'+c+'</button>').join("")+'</div><div class="grid">',pg=-1;
  L.forEach((l,i)=>{
    if(l.g!==pg){h+='<div class="sec">'+G[l.g]+'</div>';pg=l.g}
    const lock=i>0&&L[i-1].g===l.g&&!(pr(i-1).best>=PASS);
    h+='<button class="lv" data-i="'+i+'"'+(lock?" disabled":"")+'><div class="e">'+(lock?"🔒":l.e)+'</div><div class="n">'+l.n+'</div><div class="s">'+stars(pr(i).best||0)+'</div></button>';
  });
  $.innerHTML=h+'</div>';
  document.getElementById("hs").onclick=scores;
  document.getElementById("tb").onclick=toggleTime;
  $.querySelectorAll("#gen button").forEach(b=>b.onclick=()=>genStart(b.dataset.g==="all"?null:+b.dataset.g));
  document.getElementById("mt").onclick=toggleMute;
  const gb=document.getElementById("gb");if(gb)gb.onclick=board;
  loadVis();
  $.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i));
}

function scores(){
  clearInterval(tm);
  const es=L.map((l,i)=>({l,p:pr(i)}));
  const tp=totals().tp,gk=Object.keys(prog).filter(k=>k[0]==="G"),done=es.filter(x=>x.p.best>=PASS).length;
  const st=es.reduce((a,x)=>a+(x.p.best>=10?3:x.p.best>=8?2:x.p.best>=PASS?1:0),0);
  const top=es.filter(x=>x.p.pts).sort((a,b)=>b.p.pts-a.p.pts).slice(0,5);
  let h='<div class="stripe"></div><h1>🏆 أعلى النتائج</h1><div class="stat"><div><b>'+tp+'</b>النقاط</div><div><b>'+done+'/'+L.length+'</b>مستويات</div><div><b>'+st+'</b>★ نجوم</div></div><h3>التقدم حسب المستوى</h3>';
  G.forEach((g,gi)=>{const a=es.filter(x=>x.l.g===gi),d=a.filter(x=>x.p.best>=PASS).length;
    h+='<div style="margin:10px 0"><div class="top"><span>'+g+'</span><span>'+d+' / '+a.length+'</span></div><div class="pb"><i style="width:'+(a.length?d/a.length*100:0)+'%"></i></div></div>'});
  h+='<h3>أفضل 5 نتائج</h3>'+(top.length?top.map((x,n)=>'<div class="rk"><span>'+(n+1)+". "+CE[x.l.g]+" · "+x.l.n+'</span><span>⭐ '+x.p.pts+" · "+x.p.best+'/10</span></div>').join(""):'<p class="sub">لم تلعب أي مستوى بعد.</p>')+
  (gk.length?'<h3>🎲 الاختبار العام</h3>'+gk.map(k=>'<div class="rk"><span>'+(k==="G:all"?"كل المستويات":k.slice(2))+'</span><span>⭐ '+(prog[k].pts||0)+" · "+(prog[k].best||0)+'/20</span></div>').join(""):"")+'<div class="row" style="margin-top:16px"><button class="btn" id="bk">رجوع</button><button class="btn alt" id="rs">مسح التقدم</button></div>';
  $.innerHTML=h;
  document.getElementById("bk").onclick=home;
  document.getElementById("rs").onclick=()=>{if(confirm("هل تريد مسح كل التقدم؟")){prog={};save();scores()}};
}

function start(i){
  unlock();
  const lv=L[i],w=sh(lv.w).slice(0,10);
  const qs=w.map((x,k)=>({w:x,dir:lv.t==="a"?"art":lv.t==="c"?"cloze":k<5?"ar2de":"de2ar"}));
  S={i,qs:sh(qs),k:0,ok:0,pts:0,wrong:[],t0:Date.now(),n:10};
  ask();
}

function ask(){
  clearInterval(tm);
  const q=S.qs[S.k],lv=q.lv||L[S.i],w=q.w,base=lv.tm||(lv.t==="s"?12:lv.t==="c"?10:8),NT=TM===0,TT=NT?1:base*TM,pool=lv.w.filter(x=>x!==w);
  let head,main,opts,sub="",spk=true;
  if(q.dir==="cloze"){
    head="اختر الكلمة الناقصة";spk=false;
    main='<span class="de">'+esc(w.de).replace("___",'<span class="blank">___</span>')+'</span>';
    opts=sh([w.ans,...w.ds]).map(a=>({t:a,de:1,ok:a===w.ans}));
  }else if(q.dir==="art"){
    head="ما أداة التعريف الصحيحة؟";main='<span class="de">___ '+w.de+'</span>';
    sub='<div class="sub2">'+w.ar+'</div><div class="sub2"><span class="a-der">der</span> مذكر · <span class="a-die">die</span> مؤنث · <span class="a-das">das</span> محايد</div>';
    opts=["der","die","das"].map(a=>({t:'<span class="a-'+a+'">'+a+'</span>',de:1,ok:a===w.art}));
  }else if(q.dir==="ar2de"){
    head="اختر الترجمة الألمانية";main=w.ar;spk=false;
    opts=sh([w,...sh(pool).slice(0,3)]).map(o=>({t:fullH(o),de:1,ok:o===w}));
  }else{
    head="اختر الترجمة العربية";main='<span class="de">'+fullH(w)+'</span>';
    opts=sh([w,...sh(pool).slice(0,3)]).map(o=>({t:o.ar,de:0,ok:o===w}));
  }
  const lg=lv.t==="s"?" long":"",lm=(lv.t==="s"||lv.t==="c")?" long":"";
  $.innerHTML='<div class="top"><span>'+(S.gen?"🎲 اختبار عام":CE[lv.g]+" · "+lv.n)+'</span><span>'+(S.k+1)+' / '+S.n+'</span><span>⭐ '+S.pts+'</span></div>'+
  '<div class="bar"><i id="b"></i></div>'+
  '<div class="q"><small>'+head+'</small><div class="w'+lm+'">'+main+'</div>'+sub+(spk?'<button class="spk" id="sp" aria-label="نطق">🔊</button>':"")+'</div>'+
  '<div class="opts">'+opts.map((o,n)=>'<button class="o'+lg+'" data-n="'+n+'">'+(o.de?'<span class="de">'+o.t+'</span>':o.t)+'</button>').join("")+'</div>';
  const sp=document.getElementById("sp");
  if(sp)sp.onclick=()=>say(full(w));
  let left=TT,done=false;const bar=document.getElementById("b");
  const btns=[...$.querySelectorAll(".o")];
  function fin(pick){
    if(done)return;done=true;clearInterval(tm);
    const good=pick!==null&&opts[pick].ok;
    btns.forEach((b,n)=>{b.disabled=true;if(opts[n].ok)b.classList.add("ok");else if(n===pick)b.classList.add("no")});
    if(good){S.ok++;S.pts+=10+(NT?0:Math.ceil(left/TM))}else S.wrong.push(w);
    say(full(w));
    setTimeout(()=>{S.k++;S.k<S.n?ask():result()},lv.t==="s"||lv.t==="c"?1600:1000);
  }
  btns.forEach((b,n)=>b.onclick=()=>fin(n));
  if(!NT)tm=setInterval(()=>{left-=.1;bar.style.width=Math.max(0,left/TT*100)+"%";if(left<=TT*.35)bar.style.background="var(--bad)";if(left<=0)fin(null)},100);
}

function webSay(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function say(t){
  let T=null;
  try{T=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech}catch(e){}
  if(T&&T.speak){
    Promise.resolve(T.stop&&T.stop()).catch(()=>{}).then(()=>T.speak({text:t,lang:"de-DE",rate:.9,pitch:1,volume:1})).catch(()=>webSay(t));
  }else webSay(t);
}

function result(){
  clearInterval(tm);
  const key=S.gen?S.key:K(S.i),p=prog[key]||{};
  if(!(p.best>=S.ok))p.best=S.ok;
  if(!(p.pts>=S.pts))p.pts=S.pts;
  prog[key]=p;save();pushScore();
  const need=S.gen?Math.ceil(S.n*.7):PASS,pass=S.ok>=need,sec=Math.round((Date.now()-S.t0)/1000);
  $.innerHTML='<div class="res">'+(pass?WIN:LOSE)+'<div class="big">'+S.ok+' / '+S.n+'</div><div style="color:var(--acc);font-size:1.6rem">'+stars(Math.round(S.ok/S.n*10))+'</div>'+
  '<p>'+(pass?"🎉 مبروك! تم اجتياز المستوى":"حاول مرة أخرى، تحتاج "+need+" على الأقل")+'</p><p class="sub">النقاط: '+S.pts+' · الوقت: '+sec+' ثانية</p>'+
  '<button class="btn" id="re">إعادة المستوى</button>'+
  (!S.gen&&pass&&S.i<L.length-1?'<button class="btn" id="nx">المستوى التالي ▶</button>':"")+
  '<button class="btn alt" id="hm">القائمة</button>'+
  (S.wrong.length?'<div class="wrong"><b>للمراجعة:</b>'+S.wrong.map(w=>'<div><span class="de">'+fullH(w)+'</span>'+(w.ar?" = "+w.ar:"")+'</div>').join("")+'</div>':"")+'</div>';
  document.getElementById("re").onclick=()=>S.gen?genStart(S.g):start(S.i);
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>start(S.i+1);
  document.getElementById("hm").onclick=home;
  sfx(pass?"win":"lose");if(pass)confetti();
}
if(C.gc){
  const ep="https://"+C.gc+".goatcounter.com/count";
  window.goatcounter={endpoint:ep,no_onload:true};
  const g=document.createElement("script");g.async=true;g.src="https://gc.zgo.at/count.js";
  g.onload=()=>{try{window.goatcounter.count({path:"/"})}catch(e){}};
  g.onerror=()=>{try{new Image().src=ep+"?p=%2F&r="+encodeURIComponent(document.referrer)+"&t="+Date.now()}catch(e){}};
  document.head.appendChild(g);
}
welcome();
</script>
