<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الألمانية – اختبار السرعة</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c1b18;--mut:#6b675e;--pri:#d62828;--acc:#f4b400;--ok:#2e9e5b;--bad:#d62828;--bd:#e3dfd5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--card:#232119;--tx:#f3f0e6;--mut:#a39e8f;--bd:#3a372c;--pri:#ef5350}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,#222 33%,#d62828 33% 66%,#f4b400 66%);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{grid-column:1/-1;font-weight:800;margin:10px 0 0;color:var(--pri)}
.lv{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.lv .e{font-size:2rem}.lv .n{font-weight:700;margin:4px 0}.lv .s{color:var(--acc);letter-spacing:2px;min-height:1.3em}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px 12px;text-align:center;margin:12px 0}
.q small,.sub2{display:block;color:var(--mut);margin-bottom:8px}
.sub2{font-size:.9rem;margin:6px 0 0}
.q .w{font-size:2.2rem;font-weight:800}
.q .w.long{font-size:1.5rem;line-height:1.5}
.de{direction:ltr;unicode-bidi:isolate;display:inline-block}
.opts{display:grid;gap:10px}
.o{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;font:inherit;font-size:1.2rem;color:inherit;cursor:pointer}
.o.long{font-size:1rem}
.o:active{transform:scale(.98)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.spk{background:none;border:0;font-size:1.4rem;cursor:pointer}
.res{text-align:center}.big{font-size:3rem;font-weight:800}
.wrong{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;text-align:start;margin-top:12px}
.wrong div{padding:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P=s=>{const[a,b]=s.split("|");const m=/^(der|die|das) (.+)$/.exec(a);return m?{art:m[1],de:m[2],ar:b}:{de:a,ar:b}};
const full=x=>x.art?x.art+" "+x.de:x.de;
const W=(g,n,e,t,l)=>({g,n,e,t,w:l.map(P)});
const G=["كلمات","أدوات التعريف (der / die / das)","جمل"];
const L=[
W(0,"التحيات","👋","w",["Hallo|مرحبا","Danke|شكرا","Bitte|من فضلك","Ja|نعم","Nein|لا","Tschüss|وداعا","Guten Morgen|صباح الخير","Gute Nacht|تصبح على خير","Entschuldigung|آسف","Willkommen|أهلا بك"]),
W(0,"الأرقام","🔢","w",["eins|واحد","zwei|اثنان","drei|ثلاثة","vier|أربعة","fünf|خمسة","sechs|ستة","sieben|سبعة","acht|ثمانية","neun|تسعة","zehn|عشرة"]),
W(0,"الطعام","🍞","w",["das Wasser|ماء","das Brot|خبز","die Milch|حليب","der Apfel|تفاحة","das Fleisch|لحم","der Käse|جبن","der Reis|أرز","der Kaffee|قهوة","das Ei|بيضة","der Fisch|سمك"]),
W(0,"العائلة","👨‍👩‍👧","w",["der Vater|أب","die Mutter|أم","der Bruder|أخ","die Schwester|أخت","der Sohn|ابن","die Tochter|ابنة","der Großvater|جد","die Großmutter|جدة","das Kind|طفل","der Freund|صديق"]),
W(0,"الأفعال","🏃","w",["gehen|يذهب","kommen|يأتي","essen|يأكل","trinken|يشرب","lernen|يتعلم","sprechen|يتكلم","schlafen|ينام","lesen|يقرأ","schreiben|يكتب","arbeiten|يعمل"]),
W(0,"أشياء وأماكن","🏠","w",["das Haus|بيت","die Schule|مدرسة","die Stadt|مدينة","das Auto|سيارة","das Buch|كتاب","der Tisch|طاولة","die Straße|شارع","die Arbeit|عمل","die Zeit|وقت","der Hund|كلب"]),
W(0,"الألوان","🎨","w",["rot|أحمر","blau|أزرق","grün|أخضر","gelb|أصفر","schwarz|أسود","weiß|أبيض","braun|بني","grau|رمادي","orange|برتقالي","rosa|وردي"]),
W(0,"الجسم","🧍","w",["der Kopf|رأس","die Hand|يد","das Auge|عين","das Ohr|أذن","die Nase|أنف","der Mund|فم","der Fuß|قدم","das Herz|قلب","der Arm|ذراع","das Bein|ساق"]),
W(0,"الأيام والوقت","📅","w",["Montag|الاثنين","Dienstag|الثلاثاء","Mittwoch|الأربعاء","Donnerstag|الخميس","Freitag|الجمعة","Samstag|السبت","Sonntag|الأحد","heute|اليوم","morgen|غدا","gestern|أمس"]),
W(0,"الصفات","↔️","w",["groß|كبير","klein|صغير","neu|جديد","alt|قديم","gut|جيد","schlecht|سيء","schnell|سريع","langsam|بطيء","heiß|حار","kalt|بارد"]),
W(1,"أدوات التعريف ١","📘","a",["die Mutter|أم","das Brot|خبز","der Vater|أب","der Tisch|طاولة","die Schule|مدرسة","das Kind|طفل","das Auto|سيارة","die Stadt|مدينة","der Hund|كلب","das Buch|كتاب"]),
W(1,"أدوات التعريف ٢","📗","a",["das Ei|بيضة","das Herz|قلب","die Nase|أنف","der Fuß|قدم","das Wasser|ماء","die Tochter|ابنة","der Sohn|ابن","der Fisch|سمك","die Arbeit|عمل","der Reis|أرز"]),
W(2,"جمل التعارف","💬","s",["Ich heiße Ahmed.|اسمي أحمد","Wie geht es dir?|كيف حالك؟","Mir geht es gut.|أنا بخير","Ich komme aus Ägypten.|أنا من مصر","Ich spreche Arabisch.|أنا أتكلم العربية","Ich lerne Deutsch.|أنا أتعلم الألمانية","Woher kommst du?|من أين أنت؟","Wie heißt du?|ما اسمك؟","Ich verstehe nicht.|أنا لا أفهم","Sprichst du Englisch?|هل تتكلم الإنجليزية؟"]),
W(2,"جمل يومية","☕","s",["Ich habe Hunger.|أنا جائع","Ich habe Durst.|أنا عطشان","Wo ist die Toilette?|أين الحمام؟","Wie viel kostet das?|كم يكلف هذا؟","Ich möchte einen Kaffee.|أريد قهوة","Das Wasser ist kalt.|الماء بارد","Das Essen ist gut.|الطعام جيد","Ich gehe nach Hause.|أنا ذاهب إلى البيت","Ich liebe dich.|أحبك","Bis morgen!|أراك غدا"]),
W(2,"جمل بسيطة","📝","s",["Der Vater arbeitet heute.|الأب يعمل اليوم","Die Mutter kocht Reis.|الأم تطبخ الأرز","Das Kind schläft.|الطفل ينام","Der Hund ist groß.|الكلب كبير","Das Auto ist neu.|السيارة جديدة","Ich lese ein Buch.|أنا أقرأ كتابا","Wir essen Brot.|نحن نأكل الخبز","Die Schule ist klein.|المدرسة صغيرة","Mein Bruder ist schnell.|أخي سريع","Ich sehe das Haus.|أنا أرى البيت"])
];
const PASS=7;
let prog={};
try{prog=JSON.parse(localStorage.getItem("dp")||"{}")}catch(e){prog={}}
function save(){try{localStorage.setItem("dp",JSON.stringify(prog))}catch(e){}}
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=b=>b>=10?"★★★":b>=8?"★★☆":b>=PASS?"★☆☆":"☆☆☆";
let S=null,tm=null;

function home(){
  clearInterval(tm);
  let h='<div class="stripe"></div><h1>Deutsch lernen 🇩🇪</h1><p class="sub">اختبار سرعة: 10 أسئلة لكل مستوى. أجب بسرعة لتحصل على نقاط أكثر. أحرز '+PASS+' من 10 لفتح المستوى التالي.</p><div class="grid">',pg=-1;
  L.forEach((l,i)=>{
    if(l.g!==pg){h+='<div class="sec">'+G[l.g]+'</div>';pg=l.g}
    const lock=i>0&&L[i-1].g===l.g&&!((prog[i-1]||{}).best>=PASS);
    h+='<button class="lv" data-i="'+i+'"'+(lock?" disabled":"")+'><div class="e">'+(lock?"🔒":l.e)+'</div><div class="n">'+l.n+'</div><div class="s">'+stars((prog[i]||{}).best||0)+'</div></button>';
  });
  $.innerHTML=h+'</div>';
  $.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i));
}

function start(i){
  const lv=L[i],w=sh(lv.w);
  const qs=w.map((x,k)=>({w:x,dir:lv.t==="a"?"art":k<5?"ar2de":"de2ar"}));
  S={i,qs:sh(qs),k:0,ok:0,pts:0,wrong:[],t0:Date.now()};
  ask();
}

function ask(){
  clearInterval(tm);
  const lv=L[S.i],q=S.qs[S.k],w=q.w,TT=lv.t==="s"?12:8,pool=lv.w.filter(x=>x!==w);
  let head,main,opts,sub="",spk=true;
  if(q.dir==="art"){
    head="ما أداة التعريف الصحيحة؟";main='<span class="de">___ '+w.de+'</span>';
    sub='<div class="sub2">'+w.ar+'</div><div class="sub2">der مذكر · die مؤنث · das محايد</div>';
    opts=["der","die","das"].map(a=>({t:a,de:1,ok:a===w.art}));
  }else if(q.dir==="ar2de"){
    head="اختر الترجمة الألمانية";main=w.ar;spk=false;
    opts=sh([w,...sh(pool).slice(0,3)]).map(o=>({t:full(o),de:1,ok:o===w}));
  }else{
    head="اختر الترجمة العربية";main='<span class="de">'+full(w)+'</span>';
    opts=sh([w,...sh(pool).slice(0,3)]).map(o=>({t:o.ar,de:0,ok:o===w}));
  }
  const lg=lv.t==="s"?" long":"";
  $.innerHTML='<div class="top"><span>'+lv.n+'</span><span>'+(S.k+1)+' / 10</span><span>⭐ '+S.pts+'</span></div>'+
  '<div class="bar"><i id="b"></i></div>'+
  '<div class="q"><small>'+head+'</small><div class="w'+lg+'">'+main+'</div>'+sub+(spk?'<button class="spk" id="sp" aria-label="نطق">🔊</button>':"")+'</div>'+
  '<div class="opts">'+opts.map((o,n)=>'<button class="o'+lg+'" data-n="'+n+'">'+(o.de?'<span class="de">'+o.t+'</span>':o.t)+'</button>').join("")+'</div>';
  const sp=document.getElementById("sp");
  if(sp)sp.onclick=()=>say(full(w));
  let left=TT,done=false;const bar=document.getElementById("b");
  const btns=[...$.querySelectorAll(".o")];
  function fin(pick){
    if(done)return;done=true;clearInterval(tm);
    const good=pick!==null&&opts[pick].ok;
    btns.forEach((b,n)=>{b.disabled=true;if(opts[n].ok)b.classList.add("ok");else if(n===pick)b.classList.add("no")});
    if(good){S.ok++;S.pts+=10+Math.ceil(left)}else S.wrong.push(w);
    say(full(w));
    setTimeout(()=>{S.k++;S.k<10?ask():result()},lv.t==="s"?1600:1000);
  }
  btns.forEach((b,n)=>b.onclick=()=>fin(n));
  tm=setInterval(()=>{left-=.1;bar.style.width=Math.max(0,left/TT*100)+"%";if(left<=3)bar.style.background="var(--bad)";if(left<=0)fin(null)},100);
}

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";speechSynthesis.speak(u)}catch(e){}}

function result(){
  clearInterval(tm);
  const p=prog[S.i]||{};
  if(!(p.best>=S.ok))p.best=S.ok;
  if(!(p.pts>=S.pts))p.pts=S.pts;
  prog[S.i]=p;save();
  const pass=S.ok>=PASS,sec=Math.round((Date.now()-S.t0)/1000);
  $.innerHTML='<div class="res"><div class="big">'+S.ok+' / 10</div><div style="color:var(--acc);font-size:1.6rem">'+stars(S.ok)+'</div>'+
  '<p>'+(pass?"🎉 أحسنت! تم اجتياز المستوى":"حاول مرة أخرى، تحتاج "+PASS+" على الأقل")+'</p><p class="sub">النقاط: '+S.pts+' · الوقت: '+sec+' ثانية</p>'+
  '<button class="btn" id="re">إعادة المستوى</button>'+
  (pass&&S.i<L.length-1?'<button class="btn" id="nx">المستوى التالي ▶</button>':"")+
  '<button class="btn alt" id="hm">القائمة</button>'+
  (S.wrong.length?'<div class="wrong"><b>للمراجعة:</b>'+S.wrong.map(w=>'<div><span class="de">'+full(w)+'</span> = '+w.ar+'</div>').join("")+'</div>':"")+'</div>';
  document.getElementById("re").onclick=()=>start(S.i);
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>start(S.i+1);
  document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
