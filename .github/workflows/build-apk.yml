name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html words.js www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@5
          npx cap init "Deutsch" com.deutsch.quiz --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          find android -name "*.apk" -print
          find android -name "*.apk" -exec cp {} out/deutsch.apk \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: deutsch-apk
          path: out/deutsch.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/deutsch.apk \
            --title "Deutsch APK #${{ github.run_number }}" \
            --notes "Debug APK built automatically"
